version: '3.8'

services:
  dev:
    build:
      args:
        - BUILDKIT_INLINE_CACHE=1
      dockerfile: .devcontainer/Dockerfile
    environment:
      - NODE_OPTIONS=--max-old-space-size=512
      - PYTHONUNBUFFERED=1
      - DOCKER_BUILDKIT=1
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'